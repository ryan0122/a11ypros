<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#e6f2ef;}
  .canvas{width:600px;padding:28px 28px 0 28px;box-sizing:border-box;background:linear-gradient(180deg,#e6f2ef 0%,#d3e9e3 100%);}
  .win{width:544px;background:#fff;border-radius:10px 10px 0 0;overflow:hidden;box-shadow:0 12px 32px rgba(0,29,47,.18),0 2px 6px rgba(0,29,47,.10);}
  .bar{height:34px;background:#001D2F;display:flex;align-items:center;padding:0 12px;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;background:#3d5566;}
  .url{margin-left:14px;flex:1;height:20px;border-radius:5px;background:#12324a;color:#cbd5e1;font:500 11px/20px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding-left:10px;}
  .slice{width:544px;overflow:hidden;position:relative;}
  .slice img{width:544px;display:block;position:absolute;left:0;}
  .top{height:82px;} .top img{top:0;}
  .bottom{height:200px;} .bottom img{top:-127.8px;}
</style></head>
<body>
<div class="canvas"><div class="win">
  <div class="bar"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="url">studio.a11ypros.com</span></div>
  <div class="slice top"><img src="studio-issues-raw.webp" alt=""></div>
  <div class="slice bottom"><img src="studio-issues-raw.webp" alt=""></div>
</div></div>
</body></html>
