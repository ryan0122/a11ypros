<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Metallic Gantry Gradient -->
    <linearGradient id="metalGantry" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>

    <!-- Steel Bed Gradient -->
    <linearGradient id="steelBed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Cutting Torch Emerald Beam -->
    <linearGradient id="plasmaBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#0E8168" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="torchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Workshop Floor / Backdrop -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Perspective Floor Grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.4">
    <line x1="50" y1="460" x2="750" y2="460" />
    <line x1="80" y1="410" x2="720" y2="410" />
    <line x1="120" y1="360" x2="680" y2="360" />
    <line x1="160" y1="320" x2="640" y2="320" />
    
    <line x1="50" y1="460" x2="220" y2="280" />
    <line x1="200" y1="460" x2="300" y2="280" />
    <line x1="380" y1="460" x2="400" y2="280" />
    <line x1="600" y1="460" x2="500" y2="280" />
    <line x1="750" y1="460" x2="580" y2="280" />
  </g>

  <!-- Heavy Cutting Bed Framework -->
  <!-- Heavy Base Legs -->
  <rect x="110" y="310" width="36" height="130" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <rect x="654" y="310" width="36" height="130" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <rect x="130" y="420" width="540" height="16" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>

  <!-- Water/Downdraft Table Tub -->
  <polygon points="100,310 700,310 670,360 130,360" fill="url(#steelBed)" stroke="#475569" stroke-width="2"/>

  <!-- Steel Cutting Slats (Grid pattern) -->
  <g stroke="#64748B" stroke-width="2">
    <line x1="150" y1="315" x2="168" y2="355"/>
    <line x1="190" y1="315" x2="208" y2="355"/>
    <line x1="230" y1="315" x2="248" y2="355"/>
    <line x1="270" y1="315" x2="288" y2="355"/>
    <line x1="310" y1="315" x2="328" y2="355"/>
    <line x1="350" y1="315" x2="368" y2="355"/>
    <line x1="390" y1="315" x2="408" y2="355"/>
    <line x1="430" y1="315" x2="448" y2="355"/>
    <line x1="470" y1="315" x2="488" y2="355"/>
    <line x1="510" y1="315" x2="528" y2="355"/>
    <line x1="550" y1="315" x2="568" y2="355"/>
    <line x1="590" y1="315" x2="608" y2="355"/>
    <line x1="630" y1="315" x2="648" y2="355"/>
  </g>

  <!-- Steel Sheet Plate being cut -->
  <polygon points="170,320 620,320 595,348 190,348" fill="#475569" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Cut contour line on metal -->
  <path d="M 230,332 L 380,332 A 15 15 0 0 1 395,342 L 395,346" fill="none" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="4,2"/>

  <!-- Gantry Rails (Y-Axis Precision Linear Guide Rails) -->
  <rect x="85" y="270" width="25" height="150" rx="3" fill="#334155" stroke="#64748B" stroke-width="2"/>
  <rect x="690" y="270" width="25" height="150" rx="3" fill="#334155" stroke="#64748B" stroke-width="2"/>
  <line x1="97" y1="270" x2="97" y2="420" stroke="#0E8168" stroke-width="3"/>
  <line x1="702" y1="270" x2="702" y2="420" stroke="#0E8168" stroke-width="3"/>

  <!-- Dual Gantry End Trucks / Risers -->
  <polygon points="75,250 120,250 115,290 80,290" fill="#0E8168" stroke="#10B981" stroke-width="1.5"/>
  <polygon points="680,250 725,250 720,290 685,290" fill="#0E8168" stroke="#10B981" stroke-width="1.5"/>

  <!-- Dual High-Stiffness Gantry Beam (X-Axis Bridge) -->
  <rect x="95" y="195" width="610" height="52" rx="6" fill="url(#metalGantry)" stroke="#94A3B8" stroke-width="2"/>
  <!-- Gantry Accent Brand Strip -->
  <rect x="115" y="215" width="570" height="12" rx="2" fill="#0F172A"/>
  <text x="130" y="224" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#10B981" letter-spacing="1.5">APEXCUT 9000 INDUSTRIAL GANTRY</text>

  <!-- Precision Cable Track / Drag Chain -->
  <g fill="#1E293B" stroke="#475569" stroke-width="1">
    <rect x="160" y="180" width="16" height="12" rx="2"/>
    <rect x="180" y="180" width="16" height="12" rx="2"/>
    <rect x="200" y="180" width="16" height="12" rx="2"/>
    <rect x="220" y="180" width="16" height="12" rx="2"/>
    <rect x="240" y="180" width="16" height="12" rx="2"/>
    <rect x="260" y="180" width="16" height="12" rx="2"/>
    <rect x="280" y="180" width="16" height="12" rx="2"/>
    <rect x="300" y="180" width="16" height="12" rx="2"/>
    <rect x="320" y="180" width="16" height="12" rx="2"/>
    <rect x="340" y="180" width="16" height="12" rx="2"/>
    <rect x="360" y="180" width="16" height="12" rx="2"/>
    <rect x="380" y="180" width="16" height="12" rx="2"/>
  </g>

  <!-- CNC Dual Cutting Carriage (Z-Axis Station) -->
  <rect x="360" y="185" width="75" height="85" rx="5" fill="#1E293B" stroke="#0E8168" stroke-width="2.5"/>
  <circle cx="397" cy="205" r="9" fill="#0E8168"/>
  <text x="397" y="208" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Z1</text>

  <!-- Cutting Torch Assembly (Height Sensor & Nozzle) -->
  <rect x="390" y="255" width="15" height="60" rx="2" fill="#64748B" stroke="#94A3B8" stroke-width="1.5"/>
  <polygon points="388,315 407,315 401,332 394,332" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>

  <!-- Intense Plasma Cutting Arc & Sparks Glow -->
  <!-- Plasma Jet Beam -->
  <polygon points="395,332 400,332 399,343 396,343" fill="url(#plasmaBeam)" filter="url(#torchGlow)"/>
  <circle cx="397" cy="342" r="8" fill="#FFFFFF" opacity="0.9" filter="url(#torchGlow)"/>
  <circle cx="397" cy="342" r="18" fill="#34D399" opacity="0.4" filter="url(#torchGlow)"/>

  <!-- Sparks flying from the cut point -->
  <g stroke="#FDE047" stroke-width="1.5" stroke-linecap="round">
    <line x1="397" y1="342" x2="415" y2="335" />
    <line x1="397" y1="342" x2="422" y2="344" />
    <line x1="397" y1="342" x2="418" y2="352" />
    <line x1="397" y1="342" x2="380" y2="337" />
    <line x1="397" y1="342" x2="375" y2="347" />
    <line x1="397" y1="342" x2="408" y2="355" />
  </g>
  <g fill="#F59E0B">
    <circle cx="420" cy="336" r="1.5"/>
    <circle cx="425" cy="345" r="1.2"/>
    <circle cx="372" cy="348" r="1.4"/>
    <circle cx="410" cy="358" r="1.5"/>
    <circle cx="382" cy="334" r="1.2"/>
  </g>

  <!-- Industrial Stand-Alone CNC Controller Pedestal (Left Foreground) -->
  <g transform="translate(620, 260)">
    <!-- Stand Post -->
    <rect x="25" y="60" width="16" height="120" rx="2" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <!-- Base Plate -->
    <polygon points="10,180 56,180 62,192 4,192" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <!-- Console Enclosure -->
    <rect x="0" y="0" width="66" height="65" rx="5" fill="#0F172A" stroke="#0E8168" stroke-width="2"/>
    <!-- Touchscreen GUI -->
    <rect x="6" y="6" width="54" height="38" rx="3" fill="#1E293B"/>
    <line x1="12" y1="18" x2="34" y2="18" stroke="#10B981" stroke-width="2"/>
    <line x1="12" y1="24" x2="48" y2="24" stroke="#64748B" stroke-width="1.5"/>
    <line x1="12" y1="30" x2="40" y2="30" stroke="#64748B" stroke-width="1.5"/>
    <circle cx="44" cy="18" r="4" fill="#3B82F6"/>
    <!-- Emergency Stop Button -->
    <circle cx="20" cy="53" r="5" fill="#EF4444" stroke="#991B1B" stroke-width="1"/>
    <!-- Power/Cycle Start Buttons -->
    <circle cx="34" cy="53" r="3.5" fill="#10B981"/>
    <circle cx="46" cy="53" r="3.5" fill="#3B82F6"/>
  </g>

  <!-- Status Indicator Beacon (Top of Console) -->
  <circle cx="653" cy="254" r="4" fill="#10B981" filter="url(#torchGlow)"/>

  <!-- System Badge Overlay -->
  <g transform="translate(40, 40)">
    <rect width="180" height="42" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1.5"/>
    <circle cx="22" cy="21" r="6" fill="#10B981"/>
    <text x="36" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#FFFFFF" letter-spacing="0.5">ApexCut 9000 HD</text>
    <text x="36" y="30" font-family="system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#94A3B8">Dual-Torch Gantry System</text>
  </g>
</svg>
